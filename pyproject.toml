[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hottworld"
version = "0.1.0"
description = "HoTT-CatWorld: Structure-Aware World Models for Verifiable Reasoning in Homotopy Type Theory and Higher Category Theory"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "HoTTWorld Team"}]

dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "networkx>=3.0",
]

[project.scripts]
hottworld = "hottworld.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "rich>=13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hottworld*"]
